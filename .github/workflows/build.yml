name: Build & Test

# Pushes and PRs: build + unit tests.
# Nightly and "Run workflow": everything, including the slow UI tests.
# Xcode's build folder is cached between runs so only changed files recompile.

on:
  push:
    branches: [ main, 'agent/**' ]   # agent/** = scheduled agent loop branches (see BACKLOG.md)
    # Docs, backlog and CI-helper edits can't break the app; skip the 10-minute macOS run for them.
    paths-ignore:
      - '**/*.md'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/workflows/testflight*.yml'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/cleanup-agent-branches.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/workflows/testflight*.yml'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/cleanup-agent-branches.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pushes to main queue rather than cancel each other, so every commit gets tested and the build cache gets
  # saved; a newer push to an agent branch or PR cancels the now-outdated run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      # main is fast-forwarded to an agent branch that already passed here, so the same commit was already tested:
      # then main only compiles (no simulator, no tests) to refresh the build cache every branch reads from.
      - name: Check whether this commit already passed
        id: already
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=${{ github.sha }}&status=success" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
          echo "passed=$([ "$N" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so file dates can be restored below

      # A fresh checkout stamps every file "now", which makes Xcode recompile everything even with a
      # cached build folder. Reset each file to its last commit time so unchanged files stay up to date.
      - name: Restore file dates
        run: |
          python3 - <<'EOF'
          import os, subprocess
          out = subprocess.run(["git", "log", "--format=@%ct", "--name-only"],
                               capture_output=True, text=True, check=True).stdout
          seen, ts = set(), None
          for line in out.splitlines():
              if line.startswith("@"):
                  ts = int(line[1:])
              elif line and line not in seen and os.path.isfile(line):
                  seen.add(line)
                  os.utime(line, (ts, ts))
          print(f"restored {len(seen)} file dates")
          EOF
          # Runners get new disk inodes each time; tell Xcode not to treat that as a change.
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      # Booting the simulator took ~4 of the ~8 minutes, idle after compiling. Start it now, in the background,
      # so it boots while the cache restores and the app compiles.
      - name: Boot simulator early
        if: steps.already.outputs.passed != 'true'
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" &

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: deriveddata-test-${{ runner.os }}-

      - name: Refresh build cache only
        if: steps.already.outputs.passed == 'true'
        run: |
          set -o pipefail
          # Same simulator destination as the test run, so the cached output matches what branches build.
          SIM=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild build-for-testing -scheme RecipeFinder -destination "id=$SIM" \
            -derivedDataPath DerivedData -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log

      - name: Build & test
        if: steps.already.outputs.passed != 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          SKIP="-skip-testing:RecipeFinderUITests"
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then SKIP=""; fi
          xcrun simctl bootstatus "$SIM" -b
          # One simulator, no clones (parallel testing cloned devices for a 20-second suite), no coverage report.
          xcodebuild test \
            -scheme RecipeFinder \
            -destination "id=$SIM" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            $SKIP \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log

      # Saved even when tests fail or the run is cancelled after building: the compiled output is still valid,
      # and a save that only happened on success meant the cache was never written.
      - name: Save build cache
        if: always() && hashFiles('DerivedData/**') != ''
        uses: actions/cache/save@v4
        with:
          path: DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ github.sha }}

      - name: Keep logs if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
