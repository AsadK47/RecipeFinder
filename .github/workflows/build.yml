name: Build & Test

# Pushes and PRs: build + unit tests (~4 min).
# Nightly and "Run workflow": everything, including the slow UI tests (~12 min).

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build & test
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          SKIP="-skip-testing:RecipeFinderUITests"
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then SKIP=""; fi
          SIM=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test \
            -scheme RecipeFinder \
            -destination "id=$SIM" \
            -resultBundlePath TestResults.xcresult \
            $SKIP \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log

      - name: Keep logs if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
