name: Build & Test iOS App

on:
  push:
    branches: [ main ]
    paths:
      - 'RecipeFinder/**'
      - 'RecipeFinderTests/**'
      - 'RecipeFinderUITests/**'
      - 'RecipeShareExtension/**'
      - '*.xcodeproj/**'
      - 'Package.swift'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: RecipeFinder

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Detect available simulator
        id: simulator
        run: |
          LATEST_IOS=$(xcrun simctl list devices available iPhone | grep -oE '\([0-9]+\.[0-9]+' | sed 's/(//' | sort -V | tail -1)
          DEVICE=$(xcrun simctl list devices available iPhone | grep "($LATEST_IOS)" | head -1)
          DEVICE_NAME=$(echo "$DEVICE" | sed -E 's/^[[:space:]]+([^(]+) .*/\1/' | xargs)
          echo "DESTINATION=platform=iOS Simulator,name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "Using destination: $DEVICE_NAME (iOS $LATEST_IOS)"

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme "$SCHEME"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination '${{ steps.simulator.outputs.DESTINATION }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log

      - name: Upload logs and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
