name: Build & Test

# Pushes and PRs: build + unit tests. Nightly and "Run workflow": also every UI test, split across 3 parallel jobs.
# Coverage runs nightly in coverage.yml (a coverage build can't reuse this cache). Target: every run <= 10 min.
# Build cache: written only by main, read by every run (cold build 8m41s vs restore 0:12 + incremental build ~1 min).

permissions:
  contents: read
  actions: read     # the gate job lists earlier runs

on:
  push:
    branches: [ main, 'agent/**' ]   # agent/** = scheduled agent loop branches (see BACKLOG.md)
    # Docs, backlog and CI-helper edits can't break the app; skip the 10-minute macOS run for them.
    paths-ignore:
      - '**/*.md'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/workflows/testflight*.yml'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/cleanup-agent-branches.yml'
      - '.github/workflows/coverage.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/workflows/testflight*.yml'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/cleanup-agent-branches.yml'
      - '.github/workflows/coverage.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  # The nightly gets its own group, so it never cancels or holds up a push to main.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  # Pushes to main queue rather than cancel each other, so every commit gets tested and the build cache gets
  # saved; a newer push to an agent branch or PR cancels the now-outdated run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # main is fast-forwarded to an agent branch that already passed here, so that exact commit was already tested:
  # main then only compiles, to write the build cache every branch reads. A few seconds on Linux.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          RUN=true
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            N=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=${{ github.sha }}&status=success" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
            [ "$N" -gt 0 ] && RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  test:
    name: Build & Test
    needs: gate
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so file dates can be restored

      - uses: ./.github/actions/prepare
        with:
          boot: ${{ needs.gate.outputs.run }}

      - name: Test
        if: needs.gate.outputs.run == 'true'
        env:
          NSUnbufferedIO: 'YES'   # log lines arrive as they happen, so the timestamps show where time goes
        run: |
          set -o pipefail
          # -collect-test-diagnostics never: no `simctl diagnose` dump after the run (Nuke measured 610s -> 6s).
          xcodebuild test-without-building -scheme RecipeFinder -destination "id=$SIM" -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult -collect-test-diagnostics never \
            -skip-testing:RecipeFinderUITests | tee -a xcodebuild.log

      # main saves a booted, emptied simulator for every later run (once per Xcode version; branches can't save
      # caches other branches read).
      - name: Empty the simulator
        if: always() && github.ref == 'refs/heads/main' && needs.gate.outputs.run == 'true' && env.SIM_CACHE_HIT != 'true'
        run: |
          for APP in com.asadkhan.recipefinder com.asadkhan.recipefinderuitests.xctrunner; do
            xcrun simctl uninstall "$SIM" "$APP" || true
          done
          xcrun simctl shutdown "$SIM" || true

      - name: Save booted simulator
        if: always() && github.ref == 'refs/heads/main' && needs.gate.outputs.run == 'true' && env.SIM_CACHE_HIT != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SIM_DIR }}
          key: ${{ env.SIM_KEY }}

      # Only main writes the cache (Home Assistant, Element X): per-branch saves filled the 10 GB limit and evicted it.
      - name: Save build cache
        if: always() && github.ref == 'refs/heads/main' && hashFiles('DerivedData/**') != ''
        uses: actions/cache/save@v4
        with:
          path: DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ github.sha }}

      - name: Keep logs if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult

  # Each shard builds for itself (~1 min from the cache) rather than downloading one build: same wall time, no
  # artifact hand-off. shard-ui-tests.py deals Xcode's own test list by measured duration, so every UI test runs
  # in exactly one shard. 3 shards + the unit job leave 1 of the free plan's 5 macOS slots for other lanes (a
  # 5th job queued 9 min behind them).
  ui:
    name: UI tests ${{ matrix.shard }}/3
    needs: gate
    if: needs.gate.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare

      - name: UI tests
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
          NSUnbufferedIO: 'YES'
        run: |
          set -o pipefail
          xcodebuild test-without-building -scheme RecipeFinder -destination "id=$SIM" -derivedDataPath DerivedData \
            -only-testing:RecipeFinderUITests -enumerate-tests -test-enumeration-style flat \
            -test-enumeration-format json -test-enumeration-output-path tests.json >/dev/null
          ONLY=$(python3 .github/scripts/shard-ui-tests.py tests.json "$SHARD" "$SHARDS")
          echo "$ONLY" | tr ' ' '\n'
          xcodebuild test-without-building -scheme RecipeFinder -destination "id=$SIM" -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult -collect-test-diagnostics never $ONLY | tee -a xcodebuild.log

      - name: Keep logs if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            xcodebuild.log
            TestResults.xcresult
