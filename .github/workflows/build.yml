name: Build & Test

# Pushes and PRs: build + unit tests.
# Nightly and "Run workflow": everything, including the slow UI tests.
# Build cache: written only by main, read by every run (cold build 8m41s vs restore ~3 min + incremental build).

on:
  push:
    branches: [ main, 'agent/**' ]   # agent/** = scheduled agent loop branches (see BACKLOG.md)
    # Docs, backlog and CI-helper edits can't break the app; skip the 10-minute macOS run for them.
    paths-ignore:
      - '**/*.md'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/workflows/testflight*.yml'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/cleanup-agent-branches.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/workflows/testflight*.yml'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/cleanup-agent-branches.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pushes to main queue rather than cancel each other, so every commit gets tested and the build cache gets
  # saved; a newer push to an agent branch or PR cancels the now-outdated run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # main is fast-forwarded to an agent branch that already passed here, so that exact commit was already tested:
  # main then only compiles, to write the build cache every branch reads. A few seconds on Linux.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          RUN=true
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            N=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=${{ github.sha }}&status=success" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
            [ "$N" -gt 0 ] && RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  test:
    name: Build & Test
    needs: gate
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so file dates can be restored below

      # Spotlight, crash reporting and other background services compete with the simulator for the runner's 3 CPUs
      # (Bitwarden's macos-runner-tuneup). Swift Testing ran in 45s on a settled runner vs 119s on a busy one.
      - name: Quiet the runner
        run: |
          sudo mdutil -a -i off >/dev/null || true
          for s in com.apple.metadata.mds com.apple.metadata.mds.index com.apple.metadata.mds.scan com.apple.ReportCrash; do
            sudo launchctl bootout "system/$s" 2>/dev/null || true
          done
          sudo pkill -SIGKILL -f "Metadata.framework/Versions/A/Support/mds" || true

      # A fresh checkout stamps every file "now", which makes Xcode recompile everything even with a cached build
      # folder. Reset each file to its last commit time; tell Xcode new disk inodes aren't changes (TCA, Supabase).
      - name: Restore file dates
        run: |
          python3 - <<'PY'
          import os, subprocess
          out = subprocess.run(["git", "log", "--format=@%ct", "--name-only"],
                               capture_output=True, text=True, check=True).stdout
          seen, ts = set(), None
          for line in out.splitlines():
              if line.startswith("@"):
                  ts = int(line[1:])
              elif line and line not in seen and os.path.isfile(line):
                  seen.add(line)
                  os.utime(line, (ts, ts))
          PY
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      # Start the simulator now, in the background, so it boots while Xcode compiles (Sentry, Nuke, Home Assistant).
      - name: Boot simulator early
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          if [ "${{ needs.gate.outputs.run }}" = "true" ]; then xcrun simctl boot "$SIM" & fi

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: deriveddata-test-${{ runner.os }}-

      # Build once, then test that exact build, so compile and test time show separately.
      # No index store and no coverage (nobody reads them in CI); no macro/plugin validation prompts.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -scheme RecipeFinder -destination "id=$SIM" -derivedDataPath DerivedData \
            -enableCodeCoverage NO -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log

      - name: Test
        if: needs.gate.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          NSUnbufferedIO: 'YES'   # log lines arrive as they happen, so the timestamps show where time goes
        run: |
          set -o pipefail
          SKIP="-skip-testing:RecipeFinderUITests"
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then SKIP=""; fi
          time xcrun simctl bootstatus "$SIM" -b
          # -collect-test-diagnostics never: no `simctl diagnose` dump after the run (Nuke measured 610s -> 6s).
          xcodebuild test-without-building -scheme RecipeFinder -destination "id=$SIM" -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult -collect-test-diagnostics never \
            $SKIP | tee -a xcodebuild.log

      # Only main writes the cache (Home Assistant, Element X): per-branch saves filled the 10 GB limit and evicted it.
      - name: Save build cache
        if: always() && github.ref == 'refs/heads/main' && hashFiles('DerivedData/**') != ''
        uses: actions/cache/save@v4
        with:
          path: DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ github.sha }}

      - name: Keep logs if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
