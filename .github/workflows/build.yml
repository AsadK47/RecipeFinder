name: Build iOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: RecipeFinder
  CONFIGURATION: Debug
  XCODE_VERSION: '16.1'
  SWIFT_VERSION: '6.0'

jobs:
  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      destination: ${{ steps.simulator.outputs.DESTINATION }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Detect Available Simulator
        id: simulator
        run: |
          LATEST_IOS=$(xcrun simctl list devices available iPhone | grep -oE '\([0-9]+\.[0-9]+' | sed 's/(//' | sort -V | tail -1)
          DEVICE=$(xcrun simctl list devices available iPhone | grep "($LATEST_IOS)" | head -1)
          DEVICE_NAME=$(echo "$DEVICE" | sed -E 's/^[[:space:]]+([^(]+) .*/\1/' | xargs)
          echo "DESTINATION=platform=iOS Simulator,name=$DEVICE_NAME" >> $GITHUB_OUTPUT
      
      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
      
      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies -scheme ${{ env.SCHEME }}
      
      - name: Build project
        run: |
          xcodebuild build \
            -scheme ${{ env.SCHEME }} \
            -destination '${{ steps.simulator.outputs.DESTINATION }}' \
            CODE_SIGNING_ALLOWED=NO | tee build.log
      
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log

  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 30
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Run tests
        run: |
          xcodebuild test \
            -scheme ${{ env.SCHEME }} \
            -destination '${{ needs.build.outputs.destination }}' \
            CODE_SIGNING_ALLOWED=NO | tee test.log
        continue-on-error: true
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test.log

  summary:
    name: Summary
    runs-on: macos-15
    timeout-minutes: 5
    needs: [build, test]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- Swift ${{ env.SWIFT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
