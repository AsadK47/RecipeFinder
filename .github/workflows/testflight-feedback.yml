name: TestFlight feedback

# Hourly: file new TestFlight feedback (screenshots, crashes) as GitHub issues labelled `testflight-feedback`,
# which the agent loop works first. Issues, not BACKLOG.md commits: `main` is protected against bot pushes.
# Text only goes into the (public) repo; screenshots and crash logs go to a short-lived artifact.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: testflight-feedback
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch feedback
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Fetch new feedback
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.asadkhan.recipefinder
          FEEDBACK_OUT_DIR: ${{ runner.temp }}/feedback
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fetch_testflight_feedback.py

      - name: Upload screenshots and crash logs
        uses: actions/upload-artifact@v4
        with:
          name: testflight-feedback
          path: ${{ runner.temp }}/feedback
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
