name: TestFlight feedback

# Hourly: file a short notice for each new TestFlight feedback (screenshots, crashes) as a GitHub issue labelled
# `testflight-feedback`. The repo is public, so notices carry no tester content (Privacy 6.5): the owner reads the
# feedback in App Store Connect and writes what to fix on the issue before adding `owner-ok`.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: testflight-feedback
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch feedback
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Fetch new feedback
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.asadkhan.recipefinder
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fetch_testflight_feedback.py

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
