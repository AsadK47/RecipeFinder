name: Deploy Website

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'website/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Website
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Check HTML files exist
      run: |
        echo "Checking required files..."
        test -f website/index.html && echo "✓ index.html found"
        test -f website/privacy.html && echo "✓ privacy.html found"
        test -f website/terms.html && echo "✓ terms.html found"
        test -f website/cookies.html && echo "✓ cookies.html found"
        test -f website/styles.css && echo "✓ styles.css found"
        test -f website/recipefinder-site.js && echo "✓ recipefinder-site.js found"
        test -f website/CNAME && echo "✓ CNAME found"
        test -f website/robots.txt && echo "✓ robots.txt found"
        test -f website/sitemap.xml && echo "✓ sitemap.xml found"
    
    - name: Verify CNAME domain
      run: |
        DOMAIN=$(cat website/CNAME)
        if [ "$DOMAIN" != "recipefinder.uk" ]; then
          echo "❌ CNAME domain mismatch!"
          exit 1
        fi
        echo "✓ CNAME domain correct: $DOMAIN"
    
    - name: Lint HTML (optional)
      continue-on-error: true
      run: |
        npm install -g html-validate
        html-validate website/*.html || echo "⚠️  HTML validation warnings (non-critical)"
    
    - name: Check file sizes
      run: |
        echo "Checking file sizes..."
        find website -type f -name "*.html" -o -name "*.css" -o -name "*.js" | while read file; do
          size=$(wc -c < "$file")
          if [ $size -gt 1000000 ]; then
            echo "⚠️  Large file: $file ($size bytes)"
          fi
        done
        echo "✓ File size check complete"
    
    - name: Deployment info
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🚀 Website will be deployed to GitHub Pages"
        echo "🌐 URL: https://recipefinder.uk"
        echo "📝 Make sure:"
        echo "   1. GitHub Pages is enabled in repo settings"
        echo "   2. DNS is configured correctly"
        echo "   3. Assets are generated and uploaded"

