name: Screenshots

# Press "Run workflow" to capture fresh screenshots of the app on an iPhone simulator.
# The PNGs are published to the "screenshots" release:
#   https://github.com/AsadK47/RecipeFinder/releases/tag/screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Capture screenshots
    runs-on: xcode-27   # Xcode 27 image (macOS 27); macos-26 tops out at Xcode 26.6
    timeout-minutes: 50   # boot (10) + capture (36) caps + ~4 setup/publish, so publish always gets its turn

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # file dates restored below so the reused build cache stays valid

      - uses: ./.github/actions/select-xcode

      # Same as the prepare action: Spotlight, crash reporting and software update compete for the runner's 3 CPUs.
      - name: Quiet the runner
        run: |
          sudo mdutil -a -i off >/dev/null || true
          for s in com.apple.metadata.mds com.apple.metadata.mds.index com.apple.metadata.mds.scan com.apple.ReportCrash \
                   com.apple.softwareupdated; do
            sudo launchctl bootout "system/$s" 2>/dev/null || true
          done
          sudo pkill -SIGKILL -f "Metadata.framework/Versions/A/Support/mds" || true

      # Reuse Build & Test's compiled output (read-only) instead of building from scratch every time.
      - name: Restore file dates
        run: |
          python3 - <<'EOF'
          import os, subprocess
          out = subprocess.run(["git", "log", "--format=@%ct", "--name-only"],
                               capture_output=True, text=True, check=True).stdout
          seen, ts = set(), None
          for line in out.splitlines():
              if line.startswith("@"):
                  ts = int(line[1:])
              elif line and line not in seen and os.path.isfile(line):
                  seen.add(line)
                  os.utime(line, (ts, ts))
          EOF
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Restore build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ github.sha }}
          restore-keys: deriveddata-test-${{ runner.os }}-${{ env.XCODE_BUILD }}-

      - name: Boot simulator with a clean status bar
        timeout-minutes: 10
        run: |
          DEVICES=$(xcrun simctl list devices available -j)
          SIM=$(echo "$DEVICES" | jq -r '[.devices[][] | select(.name | test("iPhone.*Pro Max"))][0].udid // empty')
          [ -z "$SIM" ] && SIM=$(echo "$DEVICES" | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          # Same list as the prepare action: services the app never uses that peg the CPUs for minutes after a boot.
          until xcrun simctl spawn "$SIM" launchctl list >/dev/null 2>&1; do sleep 2; done
          for L in chronod apsd healthd healthappd fitnessintelligenced fitcore fitnesscoachingd newsd suggestd \
                   mediaanalysisd photoanalysisd siriactionsd siriinferenced siriknowledged assistantd triald \
                   mobileassetd weatherd itunescloudd spotlightknowledged corespotlightservice searchd \
                   intelligenceplatformd knowledgeconstructiond biomed duetexpertd amsengagementd; do
            ( xcrun simctl spawn "$SIM" launchctl disable "user/foreground/com.apple.$L"
              xcrun simctl spawn "$SIM" launchctl bootout "user/foreground/com.apple.$L" ) >/dev/null 2>&1 &
          done
          wait
          xcrun simctl bootstatus "$SIM" -b >/dev/null
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3

      # Capped so a slow run still publishes the shots it took (step timeout counts as failure(), cancel doesn't).
      - name: Capture
        timeout-minutes: 36
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/shots" xcodebuild test \
            -scheme RecipeFinder \
            -destination "id=$SIM" \
            -only-testing:RecipeFinderUITests/RecipeFinderScreenshotTests \
            -derivedDataPath DerivedData \
            -resultBundlePath Screenshots.xcresult \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
          ls -la "$RUNNER_TEMP/shots"

      - name: Make web-sized copies
        if: success() || failure()
        run: |
          # Full-size PNGs are ~3 MB each; the website uses 660px-wide JPEGs (~100 KB).
          for f in "$RUNNER_TEMP"/shots/*.png; do
            sips -s format jpeg -s formatOptions 82 --resampleWidth 660 "$f" \
              --out "$RUNNER_TEMP/shots/$(basename "$f" .png)-web.jpg" >/dev/null
          done

      # Only main updates the shared release; branch runs keep their screenshots as a run artifact.
      - name: Keep branch screenshots
        if: (success() || failure()) && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7

      # Agents can't download run artifacts (blob storage is blocked in their sandbox) but can read release assets,
      # so branch runs also publish the small JPEGs here for a visual check before merging.
      - name: Publish branch preview to the "screenshots-preview" release
        if: (success() || failure()) && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screenshots-preview >/dev/null 2>&1 || \
            gh release create screenshots-preview --title "Branch screenshot preview" \
              --notes "Latest branch Screenshots run (${GITHUB_REF_NAME}). Overwritten by each run." --latest=false
          gh release edit screenshots-preview --notes "Latest branch Screenshots run: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
          # Drop the previous branch's shots so a missing screen can't pass for a fresh one.
          for asset in $(gh release view screenshots-preview --json assets -q '.assets[].name'); do
            gh release delete-asset screenshots-preview "$asset" --yes
          done
          gh release upload screenshots-preview "$RUNNER_TEMP"/shots/*-web.jpg --clobber

      - name: Publish to the "screenshots" release
        if: (success() || failure()) && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screenshots >/dev/null 2>&1 || \
            gh release create screenshots --title "App screenshots" \
              --notes "Generated by the Screenshots workflow. Re-run it to refresh." --latest=false
          gh release upload screenshots "$RUNNER_TEMP"/shots/*.png "$RUNNER_TEMP"/shots/*.jpg --clobber

      - name: Keep logs if it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-logs
          path: |
            xcodebuild.log
            Screenshots.xcresult
