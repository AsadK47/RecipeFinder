name: Screenshots

# Press "Run workflow" to capture fresh screenshots of the app on an iPhone simulator.
# The PNGs are published to the "screenshots" release:
#   https://github.com/AsadK47/RecipeFinder/releases/tag/screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Capture screenshots
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # file dates restored below so the reused build cache stays valid

      # Reuse Build & Test's compiled output (read-only) instead of building from scratch every time.
      - name: Restore file dates
        run: |
          python3 - <<'EOF'
          import os, subprocess
          out = subprocess.run(["git", "log", "--format=@%ct", "--name-only"],
                               capture_output=True, text=True, check=True).stdout
          seen, ts = set(), None
          for line in out.splitlines():
              if line.startswith("@"):
                  ts = int(line[1:])
              elif line and line not in seen and os.path.isfile(line):
                  seen.add(line)
                  os.utime(line, (ts, ts))
          EOF
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: deriveddata-test-${{ runner.os }}-

      - name: Boot simulator with a clean status bar
        run: |
          DEVICES=$(xcrun simctl list devices available -j)
          SIM=$(echo "$DEVICES" | jq -r '[.devices[][] | select(.name | test("iPhone.*Pro Max"))][0].udid // empty')
          [ -z "$SIM" ] && SIM=$(echo "$DEVICES" | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3

      - name: Capture
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/shots" xcodebuild test \
            -scheme RecipeFinder \
            -destination "id=$SIM" \
            -only-testing:RecipeFinderUITests/RecipeFinderScreenshotTests \
            -derivedDataPath DerivedData \
            -resultBundlePath Screenshots.xcresult \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
          ls -la "$RUNNER_TEMP/shots"

      - name: Make web-sized copies
        if: success() || failure()
        run: |
          # Full-size PNGs are ~3 MB each; the website uses 660px-wide JPEGs (~100 KB).
          for f in "$RUNNER_TEMP"/shots/*.png; do
            sips -s format jpeg -s formatOptions 82 --resampleWidth 660 "$f" \
              --out "$RUNNER_TEMP/shots/$(basename "$f" .png)-web.jpg" >/dev/null
          done

      # Only main updates the shared release; branch runs keep their screenshots as a run artifact.
      - name: Keep branch screenshots
        if: (success() || failure()) && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7

      - name: Publish to the "screenshots" release
        if: (success() || failure()) && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screenshots >/dev/null 2>&1 || \
            gh release create screenshots --title "App screenshots" \
              --notes "Generated by the Screenshots workflow. Re-run it to refresh." --latest=false
          gh release upload screenshots "$RUNNER_TEMP"/shots/*.png "$RUNNER_TEMP"/shots/*.jpg --clobber

      - name: Keep logs if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-logs
          path: |
            xcodebuild.log
            Screenshots.xcresult
