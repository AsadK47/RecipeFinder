name: Clean up agent branches

# Daily: delete `agent/*` branches whose changes are already on main (agents can't delete remote branches themselves).
# "Already on main" uses patch identity (`git cherry`), so branches merged after a rebase count too. Branches with
# any commit not on main are left alone.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Delete merged agent branches
        run: |
          # A repository rule may refuse some deletes (GH013): skip those and carry on. Any other push error
          # still fails the job once every branch has been tried, so red keeps meaning "look at this". The lease keeps
          # a branch that gained a commit since the fetch.
          git fetch --prune origin '+refs/heads/agent/*:refs/remotes/origin/agent/*'
          deleted=0; refused=0; failed=0; kept=0
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/agent/'); do
            branch="${ref#origin/}"
            # Capture first: a failed `git cherry`, or SIGPIPE from `| grep -q` under pipefail, must never read as merged.
            if ! cherry=$(git cherry origin/main "$ref"); then
              echo "::error::git cherry failed for $branch"
              failed=$((failed + 1))
            elif grep -q '^+' <<<"$cherry"; then
              echo "keep    $branch (has commits not on main)"
              kept=$((kept + 1))
            elif out=$(git push --force-with-lease="refs/heads/$branch:$(git rev-parse "$ref")" origin --delete "$branch" 2>&1); then
              echo "delete  $branch"
              deleted=$((deleted + 1))
            elif grep -q 'GH013' <<<"$out"; then
              echo "::warning::refused $branch (repository rule GH013)"
              refused=$((refused + 1))
            else
              echo "::error::delete $branch failed: $out"
              failed=$((failed + 1))
            fi
          done
          summary="deleted $deleted · refused by rule $refused · failed $failed · kept $kept"
          echo "$summary"
          echo "Agent branches: $summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "$refused" -gt 0 ] && [ "$deleted" -eq 0 ]; then
            echo "::warning::no branch could be deleted — the ruleset refuses every agent/* delete; lift it for agent/* or retire this job"
          fi
          [ "$failed" -eq 0 ]
