name: TestFlight

# Archives a signed Release build and uploads it to App Store Connect, where it
# appears in TestFlight. Signing is automatic: Xcode uses the App Store Connect
# API key (Admin role) to fetch a cloud-managed distribution certificate and
# provisioning profiles, so no certificates or profiles live in this repo.
#
# Required repository secrets:
#   ASC_KEY_ID     - App Store Connect API key ID
#   ASC_ISSUER_ID  - App Store Connect issuer ID
#   ASC_KEY_P8     - full contents of the AuthKey_<id>.p8 file

on:
  push:
    branches: [ main ]
    paths:
      - 'RecipeFinder/**'
      - 'RecipeShareExtension/**'
      - '*.xcodeproj/**'
      - '.github/workflows/testflight.yml'
      - '.github/scripts/revoke_ci_dev_certs.py'
      - '.github/scripts/asc.py'
      # Docs inside the app folder (RecipeFinder/CLAUDE.md, DesignSystem.md) don't change the app — no upload.
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  SCHEME: RecipeFinder
  TEAM_ID: A6BJYF9NCW

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Xcode's cloud signing mints an Apple Development certificate on every fresh runner and Apple caps them, so
      # clear CI-made ones before archiving (headroom) and after the run (no build-up). Never touches distribution
      # certificates or the owner's own Mac certificate. See .github/scripts/revoke_ci_dev_certs.py.
      - name: Revoke CI development certificates (before)
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 .github/scripts/revoke_ci_dev_certs.py

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Every upload needs a higher build number than the last one.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RecipeFinder.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee archive.log

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RecipeFinder.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee export.log

      - name: Revoke CI development certificates (after)
        if: always()
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 .github/scripts/revoke_ci_dev_certs.py

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log

  # Fills TestFlight's "What to Test" with the user-facing commits since the last successful upload, so testers see
  # what changed. Runs on Linux (cheap) after the upload; waits for App Store Connect to register the build.
  notes:
    name: Set What to Test
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build notes from commits since the last upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh run list --workflow testflight.yml --branch main --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          if [ -n "$PREV" ] && git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
            git log --no-merges --format=%s "$PREV..HEAD" > "$RUNNER_TEMP/subjects.txt"
          else
            git log --no-merges --format=%s -20 HEAD > "$RUNNER_TEMP/subjects.txt"
          fi
          python3 .github/scripts/testflight_notes.py < "$RUNNER_TEMP/subjects.txt" > "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/notes.txt"

      - name: Set What to Test
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.asadkhan.recipefinder
          BUILD_NUMBER: ${{ github.run_number }}
          NOTES_FILE: ${{ runner.temp }}/notes.txt
        run: python3 .github/scripts/set_whats_new.py

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
