name: TestFlight

# Archives a signed Release build and uploads it to App Store Connect, where it
# appears in TestFlight. Signing is automatic: Xcode uses the App Store Connect
# API key (Admin role) to fetch a cloud-managed distribution certificate and
# provisioning profiles. The archive step's Apple Development certificate is one
# long-lived certificate stored as a secret, so runs reuse it instead of minting
# a new one each time (Apple caps development certificates per account).
#
# Required repository secrets:
#   ASC_KEY_ID            - App Store Connect API key ID
#   ASC_ISSUER_ID         - App Store Connect issuer ID
#   ASC_KEY_P8            - full contents of the AuthKey_<id>.p8 file
#   CI_DEV_CERT_P12       - base64 of the CI Apple Development certificate + private key (.p12)
#   CI_DEV_CERT_PASSWORD  - password of that .p12

on:
  push:
    branches: [ main ]
    paths:
      - 'RecipeFinder/**'
      - 'RecipeShareExtension/**'
      - '*.xcodeproj/**'
      - '.github/workflows/testflight.yml'
      - '.github/scripts/asc.py'
      # Docs inside the app folder (RecipeFinder/CLAUDE.md, DesignSystem.md) don't change the app — no upload.
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  SCHEME: RecipeFinder
  TEAM_ID: A6BJYF9NCW

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # A fresh runner has an empty keychain, so without this Xcode mints a new development certificate every run.
      # Importing the stored one into a throwaway keychain lets automatic signing find and reuse it.
      - name: Install CI development certificate
        env:
          CI_DEV_CERT_P12: ${{ secrets.CI_DEV_CERT_P12 }}
          CI_DEV_CERT_PASSWORD: ${{ secrets.CI_DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$CI_DEV_CERT_P12" ]; then
            echo "::error::CI_DEV_CERT_P12 secret is not set"; exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/ci-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          printf '%s' "$CI_DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/ci-dev.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/ci-dev.p12" -P "$CI_DEV_CERT_PASSWORD" -f pkcs12 -A -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/ci-dev.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Every upload needs a higher build number than the last one.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RecipeFinder.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee archive.log

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RecipeFinder.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee export.log

      - name: Remove API key and signing keychain
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH"
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log

  # Fills TestFlight's "What to Test" with the user-facing commits since the last successful upload, so testers see
  # what changed. Runs on Linux (cheap) after the upload; waits for App Store Connect to register the build.
  notes:
    name: Set What to Test
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build notes from commits since the last upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh run list --workflow testflight.yml --branch main --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          if [ -n "$PREV" ] && git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
            git log --no-merges --format=%s "$PREV..HEAD" > "$RUNNER_TEMP/subjects.txt"
          else
            git log --no-merges --format=%s -20 HEAD > "$RUNNER_TEMP/subjects.txt"
          fi
          python3 .github/scripts/testflight_notes.py < "$RUNNER_TEMP/subjects.txt" > "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/notes.txt"

      - name: Set What to Test
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.asadkhan.recipefinder
          BUILD_NUMBER: ${{ github.run_number }}
          NOTES_FILE: ${{ runner.temp }}/notes.txt
        run: python3 .github/scripts/set_whats_new.py

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
