name: TestFlight public beta

# Hand the newest build to public-link testers (Beta App Review + add to the "Public Beta" group). Manual only
# ("Run workflow") until bundled recipe method text is in our own words (owner 2026-11-25, challenges 114/178, BACKLOG
# Inbox (c)); the daily schedule (owner OK 2026-11-22) comes back after that. Named testflight-* so Build & Test skips it.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the promote script
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Promote newest build to public testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_ID: '6832321439'
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT
          chmod 600 "$KEY_PATH"
          cd .github/scripts
          ASC_KEY_PATH="$KEY_PATH" python3 asc_promote_public.py | tee -a "$GITHUB_STEP_SUMMARY"
