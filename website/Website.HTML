<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeFinder - Find Recipes Based on Your Ingredients</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem 0;
      text-align: center;
    }
    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .search-section {
      background: #f4f4f4;
      padding: 2rem;
      border-radius: 10px;
      margin: 2rem 0;
    }
    .search-box {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.8rem;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
    }
    button {
      padding: 0.8rem 2rem;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #764ba2;
    }
    .recipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .recipe-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s;
    }
    .recipe-card:hover {
      transform: translateY(-5px);
    }
    .recipe-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .recipe-content {
      padding: 1.5rem;
    }
    .recipe-content h3 {
      margin-bottom: 0.5rem;
      color: #667eea;
    }
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍳 RecipeFinder</h1>
    <p>Discover delicious recipes based on ingredients you have</p>
  </header>

  <div class="container">
    <section class="search-section">
      <h2>Find Recipes</h2>
      <div class="search-box">
        <input type="text" id="ingredients" placeholder="Enter ingredients (e.g., chicken, tomatoes, cheese)">
        <button onclick="searchRecipes()">Search</button>
      </div>
    </section>

    <div id="recipes" class="recipes-grid"></div>
  </div>

  <footer>
    <p>&copy; 2024 RecipeFinder. Find your next meal!</p>
  </footer>

  <script>
    function searchRecipes() {
      const ingredients = document.getElementById('ingredients').value;
      const recipesDiv = document.getElementById('recipes');
      
      if (!ingredients) {
        alert('Please enter some ingredients!');
        return;
      }

      // Sample recipe data (replace with API call)
      recipesDiv.innerHTML = '<p>Searching for recipes with: ' + ingredients + '</p>';
    }
  </script>
</body>
</html>
